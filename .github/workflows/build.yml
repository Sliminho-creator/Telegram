name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"; fi
          echo "sdkmanager: $SDKM"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (arm64 + armv7)
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -Pandroid.injected.build.abi=arm64-v8a,armeabi-v7a \
            --no-daemon --stacktrace

      - name: Collect, align, sign and verify APK
        run: |
          set -eo pipefail
          mkdir -p out work
          echo "--- all build outputs ---"
          find . \( -path ./out -o -path ./work \) -prune -o \( -name '*.apk' -o -name '*.aab' \) -print -exec ls -la {} \;
          APK=$(find TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK under build/outputs/apk"; exit 1; fi
          echo "Using: $APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          keytool -genkeypair -keystore work/myou.jks -storepass android -keypass android \
            -alias myou -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MaterialYou"
          "$BT/zipalign" -f -p 4 "$APK" work/aligned.apk
          "$BT/apksigner" sign --ks work/myou.jks --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out out/app.apk work/aligned.apk
          echo "--- verify ---"
          "$BT/apksigner" verify --verbose --print-certs out/app.apk | head -12
          echo "--- badging ---"
          "$BT/aapt2" dump badging out/app.apk | grep -E "^package|sdkVersion|targetSdk|native-code|uses-permission: name='android.permission.(INTERNET)'" | head
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-material-you-apk
          path: out/*.apk
          if-no-files-found: error

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"; fi
          echo "sdkmanager: $SDKM"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (arm64 only, to keep it fast)
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_AppStandalone/build/outputs -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-material-you-apk
          path: out/*.apk
          if-no-files-found: error
